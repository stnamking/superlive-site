<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPERLIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800;62..125,900&family=Hanken+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@700;900&family=Black+Han+Sans&display=swap">
<style>
/* VOICE: clinical, commanding, rhythmic — an instruction sequence cut to a bass line
   IDEA: the page is an endless edit: word, hard cut, image, hard cut, on the beat; now and then a sentence holds
   PICTURE: every work full-bleed, one frame per beat; click any frame and the film plays on Vimeo
   COLOUR+TYPE: off-white, black, one acid accent; Archivo 900 condensed for words, Noto Sans KR 900 for Hangul
   LAYOUT: one fixed stage, a thin HUD at the edges, an index and contact overlay */
:root{--w:#f4f3ef;--k:#0b0b0b;--a:#e8ff00;--f:"Archivo","Noto Sans KR",Impact,sans-serif;--s:"Hanken Grotesk","Noto Sans KR",Arial,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--k);color:var(--w);overflow:hidden}
body{font:14px/1.4 var(--s);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:var(--k)}
#stage>.fr{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.fr.t{background:var(--w);color:var(--k)}.fr.k{background:var(--k);color:var(--w)}.fr.a{background:var(--a);color:var(--k)}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.full.cv{object-fit:cover}
.full.band{top:50%;bottom:auto;height:auto;transform:translateY(-50%)}
.word{font:900 clamp(90px,28vw,500px)/.82 var(--f);font-stretch:70%;letter-spacing:-.02em;text-transform:uppercase;text-align:center;margin:0;padding:0 3vw}
.word.sm{font-size:clamp(56px,15vw,270px)}
.word.one{white-space:nowrap;font-size:clamp(40px,15.5vw,300px)}
.word{word-break:keep-all}
.word.kr{white-space:nowrap;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:-.03em;line-height:.95;font-size:clamp(80px,24vw,440px)}
.lab{position:absolute;left:24px;top:72px;font:700 13px var(--s);letter-spacing:.04em;text-transform:uppercase;z-index:2}
.lab::after{content:'';display:inline-block;width:40px;height:1px;background:currentColor;vertical-align:middle;margin-left:10px}
.say{width:100%;padding:0 4vw;text-align:center}
.say p{margin:0;white-space:nowrap;font:400 clamp(90px,24vw,440px)/.95 "Black Han Sans","Noto Sans KR",var(--f);letter-spacing:-.035em;text-wrap:balance;text-transform:uppercase}
.say p+p{margin-top:.12em}
.say p.l{font-size:clamp(60px,15vw,280px)}
.say p.en{font:900 clamp(80px,19vw,340px)/.86 var(--f);font-stretch:70%;letter-spacing:-.02em}
.say small{position:absolute;left:24px;top:72px;font:700 13px var(--s);letter-spacing:.04em}
.say small::after{content:'';display:inline-block;width:40px;height:1px;background:currentColor;vertical-align:middle;margin-left:10px}
.punch{animation:punch .36s cubic-bezier(.1,.8,.2,1)}
@keyframes punch{from{transform:scale(1.1)}to{transform:none}}

/* HUD */
.hud{position:fixed;z-index:20;mix-blend-mode:difference;color:#fff;font:600 12px var(--s);letter-spacing:.02em}
.top{inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:20px 24px}
.logo{font:900 18px/1 var(--f);font-stretch:75%;letter-spacing:.01em}
.nav{display:flex;gap:4px}.nav button{padding:10px 10px;font:600 13px var(--s)}
.bl{left:24px;bottom:18px;display:flex;gap:16px;align-items:center}
.bl button{display:flex;align-items:center;gap:8px;min-height:44px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}.eq b{width:2px;background:#fff;height:3px}
body.on .eq b{animation:eq .5s infinite alternate}.eq b:nth-child(2){animation-delay:.15s}.eq b:nth-child(3){animation-delay:.3s}
@keyframes eq{to{height:12px}}
.br{right:24px;bottom:30px;text-align:right;max-width:46vw}
.br b{display:block;font:700 13px var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snh{display:none;left:50%;top:50%;transform:translate(-50%,-50%);font:700 12px var(--s);letter-spacing:.12em;padding:10px 14px;border:1px solid #fff;pointer-events:none;top:auto;bottom:70px;transform:translateX(-50%)}
.play{position:fixed;z-index:21;left:50%;bottom:30px;transform:translateX(-50%);mix-blend-mode:difference;color:#fff;font:700 12px var(--s);letter-spacing:.08em;pointer-events:none;opacity:.9}
#stage a.go{position:absolute;inset:0;z-index:5;cursor:pointer}
/* film popup */
.film{position:fixed;inset:0;z-index:60;background:rgba(11,11,11,.94);display:none;place-items:center}
.film.on{display:grid}
.film .box{position:relative;width:min(92vw,calc(84vh*16/9));aspect-ratio:16/9;background:#000}
.film iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.film .x{position:fixed;top:14px;right:16px;font:700 13px var(--s);color:#fff;padding:12px;z-index:2}
.film .ttl{position:fixed;left:24px;top:22px;font:700 13px var(--s);color:#fff;letter-spacing:.04em;text-transform:uppercase}
/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:var(--w);color:var(--k);display:none;overflow:auto;padding:84px 24px 40px}
.ov.on{display:block}
.ov .x{position:fixed;top:14px;right:16px;font:700 13px var(--s);padding:12px;z-index:2}
.ov h2{margin:0 0 24px;font:900 clamp(48px,9vw,140px)/.85 var(--f);font-stretch:70%;text-transform:uppercase}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:0 28px;margin:0;padding:0;list-style:none}
.list li{border-top:1px solid #0b0b0b22;display:flex;align-items:center;gap:10px}
.list button{flex:1;display:flex;gap:12px;align-items:baseline;text-align:left;padding:12px 0;min-height:44px}
.list i{font-style:normal;font:600 12px var(--s);opacity:.5;width:28px}
.list span{font:900 22px/1 var(--f);font-stretch:75%;text-transform:uppercase}
.list em{font-style:normal;font:600 12px var(--s);opacity:.6;margin-left:auto;white-space:nowrap}
.list a{font:700 12px var(--s);padding:12px 4px}
#contact .word{color:var(--k);text-align:left;padding:0;margin:4vh 0 6vh}
.cinfo{display:flex;gap:40px;flex-wrap:wrap;font:600 16px var(--s)}
@media(max-width:600px){.br{bottom:70px;max-width:80vw}.play{bottom:120px}.word{font-size:clamp(72px,30vw,220px)}.word.sm{font-size:clamp(44px,15vw,120px)}.word.kr{font-size:clamp(72px,26vw,200px)}.say p{font-size:clamp(64px,24vw,160px)}.say p.en{font-size:clamp(56px,17vw,120px)}.say p.l{font-size:clamp(48px,15vw,110px)}}
@media(prefers-reduced-motion:reduce){.punch{animation:none}}
</style>
</head>
<body>
<main id="stage" aria-live="off" aria-label="SUPERLIVE work reel"></main>
<header class="hud top"><button class="logo" id="home" type="button">SUPERLIVE</button><nav class="nav"><button type="button" id="bIdx">Index</button><button type="button" id="bCon">Contact</button></nav></header>
<div class="hud bl"><button type="button" id="snd" aria-pressed="true"><i class="eq"><b></b><b></b><b></b></i><span>SOUND ON</span></button><span id="trk" style="min-height:44px;display:flex;align-items:center">MIX · SUBSTANCE</span><button type="button" id="pau" aria-pressed="false">PAUSE</button></div>
<div class="hud br" id="now"></div>
<div class="play" id="playHint"></div><div class="hud snh" id="sndHint">TAP FOR SOUND</div>
<div class="film" id="film" role="dialog" aria-modal="true" aria-label="Film"><span class="ttl" id="filmT"></span><button class="x" type="button" id="filmX">CLOSE ✕</button><div class="box" id="filmB"></div></div>
<section class="ov" id="index" aria-label="Index"><button class="x" type="button" data-close>CLOSE ✕</button><h2>Index</h2><ul class="list" id="list"></ul></section>
<section class="ov" id="contact" aria-label="Contact"><button class="x" type="button" data-close>CLOSE ✕</button><p class="word one">SUPERLIVE</p><div class="cinfo"><span>Film &amp; live visual</span><span>Pangyo, Korea</span><span>superlive.kr</span></div></section>

const dist=(()=>{let c=null;return()=>{if(c)return c;c=ac.createWaveShaper();const n=2048,k=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;k[i]=Math.tanh(x*1.2)/Math.tanh(1.2)*.8}c.curve=k;c.connect(bus);return c}})();
const grit=(t,f,d,v)=>{const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();o.type='sawtooth';o2.type='square';o.frequency.setValueAtTime(f*2,t);o.frequency.exponentialRampToValueAtTime(f,t+.06);o2.frequency.value=f*1.005;lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(120,t+d);env(g,t,.004,d,v);o.connect(lp);o2.connect(lp);lp.connect(g).connect(dist());o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)};
const thump=(t,v)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(32,t+.12);env(g,t,.002,.22,v);o.connect(g).connect(dist());o.start(t);o.stop(t+.3)};
const ping=(t,f,v)=>{const o=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain();o.type='sine';m.type='sine';o.frequency.value=f;m.frequency.value=f*1.41;mg.gain.value=f*.8;m.connect(mg).connect(o.frequency);env(g,t,.001,.35,v);o.connect(g).connect(bus);o.start(t);m.start(t);o.stop(t+.4);m.stop(t+.4)};
const tick=(t,v)=>{const n=noise(.02),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.frequency.value=5200;f.Q.value=6;env(g,t,.0005,.015,v);n.connect(f).connect(g).connect(bus);n.start(t)};
const rumble=(t,v)=>{const n=noise(.3),f=ac.createBiquadFilter(),g=ac.createGain();f.type='lowpass';f.frequency.value=160;env(g,t,.01,.22,v);n.connect(f).connect(g).connect(dist());n.start(t)};
const ohat=t=>{const n=noise(.2),f=ac.createBiquadFilter(),g=ac.createGain();f.type='highpass';f.frequency.value=6500;env(g,t,.002,.16,.14);n.connect(f).connect(g).connect(bus);n.start(t)};
/* space and melody: a reverb, a ping-pong delay, a pumping minor pad and a plucked arpeggio */
let fx=null;const FX=()=>{if(fx)return fx;const len=ac.sampleRate*2.6,ir=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
 const rv=ac.createConvolver();rv.buffer=ir;const rg=ac.createGain();rg.gain.value=.18;rv.connect(rg).connect(bus);
 const dl=ac.createDelay(1),fb=ac.createGain(),dlp=ac.createBiquadFilter(),dg=ac.createGain();dl.delayTime.value=TICK/1000*3;fb.gain.value=.38;dlp.type='lowpass';dlp.frequency.value=2600;dg.gain.value=.35;dl.connect(dlp).connect(fb).connect(dl);dlp.connect(dg).connect(bus);
 const duck=ac.createGain();duck.connect(bus);duck.connect(rv);fx={rv,dl,duck};return fx};
const CH=[[110,130.81,164.81],[87.31,130.81,174.61],[130.81,164.81,196],[98,123.47,146.83]]; // Am F C G
const pad=(t,m)=>{const f=FX(),c=CH[(m>>4)%4],d=TICK/1000*16;const lp=ac.createBiquadFilter(),g=ac.createGain();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1400,t+d*.5);lp.frequency.linearRampToValueAtTime(600,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.07,t+.25);g.gain.setValueAtTime(.07,t+d-.3);g.gain.linearRampToValueAtTime(.0001,t+d);
 for(let k=0;k<4;k++){const b=TICK/1000*4*k;g.gain.setValueAtTime(.025,t+b+.001);g.gain.linearRampToValueAtTime(.07,t+b+TICK/1000*3)}
 c.forEach(fr=>[-7,7].forEach(dt=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=fr*2;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+d+.05)}));lp.connect(g).connect(f.duck)};
const ARP=[0,2,1,2,0,2,1,3];
const arp=(t,st,m)=>{const f=FX(),c=CH[(m>>4)%4];const fr=c[ARP[st%8]%3]*(ARP[st%8]==3?2:1)*4;const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();o.type='square';o.frequency.value=fr;lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(500,t+.12);env(g,t,.002,.14,st%4==0?.06:.04);o.connect(lp).connect(g);g.connect(bus);g.connect(f.dl);o.start(t);o.stop(t+.2)};
/* Substance-style voices: a distorted impact on the cut, a tinnitus whine, a dark room drone, metal clank, stutter */
const hit=(t,v)=>{const f=FX();const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(28,t+.35);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(1800,t);lp.frequency.exponentialRampToValueAtTime(90,t+.4);env(g,t,.002,.55,v);o.connect(lp).connect(g).connect(dist());g.connect(f.rv);o.start(t);o.stop(t+.7);
 const n=noise(.12),hp=ac.createBiquadFilter(),ng=ac.createGain();hp.type='highpass';hp.frequency.value=2500;env(ng,t,.001,.08,v*.5);n.connect(hp).connect(ng).connect(bus);ng.connect(f.rv);n.start(t)};
const whine=(t,d)=>{const o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),g=ac.createGain();o.type='sine';o.frequency.value=2637;l.frequency.value=.3;lg.gain.value=6;l.connect(lg).connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.018,t+d*.4);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(g).connect(bus);o.start(t);l.start(t);o.stop(t+d);l.stop(t+d)};
const room=(t,d,m)=>{const f=FX();const o=ac.createOscillator(),o2=ac.createOscillator(),lp=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o2.type='sawtooth';const fr=[27.5,27.5,29.1,24.5][(m>>4)%4];o.frequency.value=fr;o2.frequency.value=fr*1.01;lp.type='lowpass';lp.frequency.setValueAtTime(70,t);lp.frequency.linearRampToValueAtTime(160,t+d*.6);lp.frequency.linearRampToValueAtTime(70,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.12,t+.4);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(lp);o2.connect(lp);lp.connect(g).connect(bus);g.connect(f.rv);o.start(t);o2.start(t);o.stop(t+d);o2.stop(t+d)};
const clank=(t,v)=>{const f=FX();[523,1187,1693].forEach((fr,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=fr;env(g,t,.001,.18-i*.04,v/(i+1));const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fr*1.5;bp.Q.value=4;o.connect(bp).connect(g);g.connect(bus);g.connect(f.rv);o.start(t);o.stop(t+.25)})};
/* the title-track recipe: club techno pulse, a rising "substance" swell, and hard silences */
const swell=(t,d)=>{const f=FX();const lp=ac.createBiquadFilter(),g=ac.createGain();lp.type='lowpass';lp.Q.value=6;lp.frequency.setValueAtTime(180,t);lp.frequency.exponentialRampToValueAtTime(7000,t+d*.95);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+d*.9);g.gain.setValueAtTime(.14,t+d*.97);g.gain.linearRampToValueAtTime(.0001,t+d);
 [-14,-5,5,14].forEach(dt=>{const o=ac.createOscillator();o.type='sawtooth';o.detune.value=dt;o.frequency.setValueAtTime(55,t);o.frequency.exponentialRampToValueAtTime(440,t+d);o.connect(lp);o.start(t);o.stop(t+d)});
 const n=noise(d),nf=ac.createBiquadFilter();nf.type='bandpass';nf.Q.value=1.5;nf.frequency.setValueAtTime(300,t);nf.frequency.exponentialRampToValueAtTime(9000,t+d);n.connect(nf).connect(lp);n.start(t);
 lp.connect(g);g.connect(dist());g.connect(f.rv)};
const rbass=(t,st,m)=>{if(st%4==0)return;const fr=[55,55,65.4,49][(m>>4)%4]*(st%4==2?2:1);const o=ac.createOscillator(),lp=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=fr;lp.type='lowpass';lp.Q.value=8;lp.frequency.setValueAtTime(st%4==2?1400:700,t);lp.frequency.exponentialRampToValueAtTime(120,t+.12);env(g,t,.003,.13,.12);o.connect(lp).connect(g).connect(bus);o.start(t);o.stop(t+.18)};
/* layers: each a voice pattern on the 16-step grid */
const LY={
 tick:(t,st)=>{if(st%2==0)tick(t,st%4==0?.2:.09)},
 heart:(t,st)=>{if(st==0||st==8){thump(t,.6);thump(t+TICK/1000*.75,.35)}},
 grit:(t,st,m)=>{if(st%4==0)grit(t,[36.7,36.7,41.2,32.7][(m>>4)%4],.26,.13)},
 drone:(t,st,m)=>{if(st==0)grit(t,[32.7,41.2][(m>>4)%2],.9,.18)},
 ping:(t,st)=>{if(st==6||st==14)ping(t,st==6?1320:880,.06)},
 kick:(t,st)=>{if(st%4==0)kick(t,st==0)},
 roll:(t,st)=>{if(st%4==2){ohat(t);rumble(t,.18)}},
 clap:(t,st)=>{if(st==4||st==12)clap(t)},
 hat:(t,st)=>{if(st%2==1)hat(t,st%4==3?.2:.1)},
 sub:(t,st,m)=>{if(st%4==0)sub(t,BASS[(m>>4)%4])},
 stab:(t,st,m)=>{if(st==0||st==7||st==10)grit(t,[36.7,43.6,32.7,49][(m>>4)%4],.12,.2)},
 pad:(t,st,m)=>{if(st==0)pad(t,m)},
 swell:(t,st)=>{if(st==0)swell(t,TICK/1000*32)},
 rbass:(t,st,m)=>rbass(t,st,m),
 hit2:(t,st)=>{if(st==0||st==8)hit(t,st==0?.38:.28)},
 hit4:(t,st)=>{if(st%4==0)hit(t,st==0?.36:.24)},
 whine:(t,st)=>{if(st==0)whine(t,TICK/1000*16)},
 room:(t,st,m)=>{if(st==0)room(t,TICK/1000*16,m)},
 clank:(t,st)=>{if(st==6||st==14)clank(t,.05)},
 stutter:(t,st)=>{if(st>=8)hit(t,.08+st*.01)},
 arp:(t,st,m)=>{arp(t,st,m)},
 rise:(t,st)=>{if(st==0){const n=noise(TICK/1000*16),f=ac.createBiquadFilter(),g=ac.createGain(),d=TICK/1000*16;f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(9000,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+d*.97);g.gain.linearRampToValueAtTime(.0001,t+d);n.connect(f).connect(g).connect(bus);n.start(t)}}};
/* the mix: sections of bars, layers added and taken away, looping forever */
const MIX=[[2,'SUBSTANCE',['swell','heart']],[1,'·',[]],[8,'TECHNO',['kick','rbass','hat','clap']],[8,'TECHNO',['kick','rbass','hat','clap','hit2','clank']],[1,'·',['whine']],[8,'SLAM',['kick','rbass','hit4','roll','tick']],[4,'TENSION',['room','whine','heart']],[2,'SUBSTANCE',['swell','room']],[1,'·',[]],[8,'TECHNO',['kick','rbass','hat','clap','clank']],[8,'SLAM',['kick','rbass','hit4','clap','hat']],[1,'·',['whine']]];
const MIXB=MIX.reduce((a,x)=>a+x[0],0);
const secAt=bar=>{let b=bar%MIXB;for(const x of MIX){if(b<x[0])return x;b-=x[0]}return MIX[0]};
let curSec='';
const TR=[{f:(t,st,m)=>{const x=secAt(m>>4);x[2].forEach(k=>LY[k](t,st,m));if(st==0&&x[1]!==curSec){curSec=x[1];const lbl=x[1];setTimeout(()=>{TB.textContent='MIX · '+lbl},Math.max(0,(t-ac.currentTime)*1000))}}}];
let tr=0;
let mt=0,next=0;const sch=()=>{if(!on||!ac||ac.state!=='running')return;const T=TICK/1000;if(next<ac.currentTime)next=ac.currentTime+.05;while(next<ac.currentTime+.25){const st=mt%16;TR[tr].f(next,st,mt);vq.push(next);mt++;next+=T}};const vq=[];setInterval(sch,25);
const step=()=>{tk++;left--;if(left<=0){const nx=R[(pos+1)%R.length];if(nx.t=='i'&&!ready.has(nx.n)){load(nx.n);left=1;return}show(pos+1)}};
/* visuals ride the music: when sound runs, each cut fires on the audio clock's 16th; otherwise on the frame clock */
const loop=now=>{const synced=on&&ac&&ac.state==='running';
 if(synced){const lat=(ac.outputLatency||ac.baseLatency||0);let g=0;while(vq.length&&vq[0]<=ac.currentTime-lat&&g<4){vq.shift();if(!(paused||ov))step();g++}if(vq.length>32)vq.splice(0,vq.length-4);acc=0;last=now}
 else{vq.length=0;acc+=now-last;last=now;if(paused||ov)acc=0;let g=0;while(acc>=TICK&&g<4){acc-=TICK;step();g++}if(acc>TICK*4)acc=0}
 requestAnimationFrame(loop)};requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0});
const TB=document.getElementById('trk');
const PB=document.getElementById('pau');const setPause=v=>{paused=v;PB.textContent=v?'PLAY':'PAUSE';PB.setAttribute('aria-pressed',v)};
PB.addEventListener('click',()=>setPause(!paused));
/* overlays */
let ov=null;const open=id=>{close();ov=document.getElementById(id);ov.classList.add('on');ov.querySelector('.x').focus()};const close=()=>{if(ov){ov.classList.remove('on');ov=null}};
document.getElementById('bIdx').addEventListener('click',()=>open('index'));
document.getElementById('bCon').addEventListener('click',()=>open('contact'));
document.getElementById('home').addEventListener('click',()=>{close();show(0)});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',close));
const L=document.getElementById('list');
L.innerHTML=W.map((w,i)=>`<li><button type="button" data-j="${i}"><i>${String(i+1).padStart(2,'0')}</i><span>${esc(w[3])}</span><em>${esc(w[1])}</em></button><a href="${url(w)}" target="_blank" rel="noopener" aria-label="${esc(w[1]+' '+w[3])} 영상 재생">▸</a></li>`).join('');
L.addEventListener('click',e=>{const b=e.target.closest('button[data-j]');if(!b)return;close();setPause(false);show(workStart[+b.dataset.j])});
addEventListener('keydown',e=>{if(filmOn)return;if(e.key=='Escape')close();if(ov)return;if(e.key==' '){e.preventDefault();setPause(!paused)}if(e.key=='ArrowRight')show(pos+1);if(e.key=='ArrowLeft')show(pos-1)});
show(0);
/* film popup: plays inside the page where embedding is allowed (superlive.kr); the reel and music stop, and resume on close */
const EMBED=!/claude|anthropic|localhost|^$/.test(location.hostname)||location.protocol=='file:';
const FM=document.getElementById('film'),FB=document.getElementById('filmB'),FT=document.getElementById('filmT');let filmOn=false,wasPaused=false;
const openFilm=(href,label)=>{if(!EMBED)return false;const u=new URL(href);u.searchParams.set('autoplay','1');u.searchParams.set('title','0');u.searchParams.set('byline','0');u.searchParams.set('portrait','0');
 FB.innerHTML=`<iframe src="${u.toString()}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${esc(label||'film')}"></iframe>`;FT.textContent=label||'';FM.classList.add('on');filmOn=true;wasPaused=paused;setPause(true);try{if(ac)ac.suspend()}catch(e){}document.getElementById('filmX').focus();return true};
const closeFilm=()=>{if(!filmOn)return;FM.classList.remove('on');FB.innerHTML='';filmOn=false;setPause(wasPaused);try{if(ac&&on)ac.resume()}catch(e){}};
document.getElementById('filmX').addEventListener('click',closeFilm);
FM.addEventListener('click',e=>{if(e.target===FM)closeFilm()});
document.addEventListener('click',e=>{const a=e.target.closest('a.go,#list a');if(!a||e.defaultPrevented)return;if(openFilm(a.href,a.getAttribute('aria-label')?.replace(' 영상 재생',''))){e.preventDefault();if(ov)close()}});
addEventListener('keydown',e=>{if(e.key=='Escape'&&filmOn){e.stopPropagation();closeFilm()}},true);
}
</script>
